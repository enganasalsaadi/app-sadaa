appId: com.getsadaapp
name: Login — wrong password stays on Login
tags:
  - auth
  - smoke
---
- runFlow: ../subflows/launch-to-login.yaml
- runFlow:
    file: ../subflows/fill-login.yaml
    env:
      PHONE: ${MAESTRO_E2E_PHONE}
      PASSWORD: Wrong-${MAESTRO_E2E_PASSWORD}
# 422 → errors.phone
- extendedWaitUntil:
    visible:
      id: login.phone.error
    timeout: 15000
- assertVisible:
    id: login.submit
