# Resets the test account to the SAME password, then logs in with it.
appId: com.getsadaapp
name: Forgot password — OTP → new password → login
tags:
  - auth
  - reset
env:
  OTP_CODE: "1234"
---
- runFlow: ../subflows/launch-to-login.yaml
- tapOn:
    id: login.forgotPassword
- tapOn:
    id: reset.phone
- inputText: ${MAESTRO_E2E_PHONE}
- hideKeyboard
- tapOn:
    id: reset.phone.submit
# Hidden OTP input is auto-focused; last digit auto-submits.
- extendedWaitUntil:
    visible:
      id: reset.otp
    timeout: 15000
- inputText: ${OTP_CODE}
- extendedWaitUntil:
    visible:
      id: reset.password
    timeout: 15000
- tapOn:
    id: reset.password
- inputText: ${MAESTRO_E2E_PASSWORD}
- tapOn:
    id: reset.passwordConfirmation
- inputText: ${MAESTRO_E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: reset.password.submit
# Back on Login with the number prefilled and password focused.
- extendedWaitUntil:
    visible:
      id: login.submit
    timeout: 15000
- tapOn:
    id: login.password
- inputText: ${MAESTRO_E2E_PASSWORD}
- hideKeyboard
- tapOn:
    id: login.submit
- extendedWaitUntil:
    notVisible:
      id: login.submit
    timeout: 20000
